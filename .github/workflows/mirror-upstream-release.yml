name: Mirror Upstream Release

# When kirodotdev/KiroCrew (upstream) publishes a release, cut this fork's own
# corresponding release. Upstream releases are not observable via GitHub
# events on a fork (a release published on upstream never crosses the fork
# boundary as an event here), so this polls upstream's release API on a
# schedule instead.
#
# Publishing the release created here is what triggers build-desktop-fork.yml
# (on release: published) to build and attach the macOS + Linux desktop
# artifacts -- this workflow never builds anything itself.
#
# UPSTREAM RELEASE IS THE TRIGGER, NOT THE VERSION SOURCE. Upstream's release
# tags lag its own `main` (observed: upstream's latest release is v0.3.0 while
# upstream's main -- and this fork's main, after scheduled-upstream-sync.yml
# merges it -- is already at 0.5.0). Deriving the fork's tag from upstream's
# release version would therefore cut a REGRESSION (e.g. v0.3.0-roycrew.2)
# against code the fork's own updater already considers newer. So the tag
# always comes from this fork's own src/kiro_crew/__init__.py __version__
# (mirrored in website/electron/package.json), never from upstream's tag.
#
# IDEMPOTENCY: every release this workflow creates embeds an HTML-comment
# marker naming the upstream release that prompted it. "Is a mirror due" is
# answered by comparing upstream's current latest tag against the marker in
# THIS fork's own latest release -- not by comparing version numbers across
# repos, which is exactly the comparison that traps on the lag above.
#
# N: computed here, not trusted from __init__.py's suffix -- multiple upstream
# releases can land between two fork version bumps, and each still needs its
# own distinguishable roycrew build. N is one more than the highest existing
# roycrew release for the fork's current base version (0 if none exist yet).

on:
  schedule:
    - cron: "0 */4 * * *" # every 4 hours; upstream releases are infrequent, cheap to poll
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: mirror-upstream-release
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror upstream release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPO: kirodotdev/KiroCrew
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check whether a new upstream release needs mirroring
        id: check
        run: |
          set -euo pipefail

          UPSTREAM_JSON="$(gh api "repos/${UPSTREAM_REPO}/releases/latest")"
          UPSTREAM_TAG="$(printf '%s' "$UPSTREAM_JSON" | jq -r '.tag_name')"
          UPSTREAM_URL="$(printf '%s' "$UPSTREAM_JSON" | jq -r '.html_url')"
          UPSTREAM_BODY="$(printf '%s' "$UPSTREAM_JSON" | jq -r '.body // ""')"

          # The fork's own latest non-draft release carries the marker this
          # workflow wrote into it last time. No marker found (first-ever run,
          # or the latest release predates this workflow) is treated as
          # "nothing mirrored yet" -- conservative, triggers a mirror.
          FORK_LATEST_BODY="$(gh api "repos/${{ github.repository }}/releases" --jq 'first(.[] | select(.draft==false)).body // ""')"
          LAST_MIRRORED="$(printf '%s' "$FORK_LATEST_BODY" | sed -n 's/.*<!-- mirrors-upstream: \(v[^ ]*\) -->.*/\1/p' | head -1)"

          echo "upstream latest: ${UPSTREAM_TAG} (fork last mirrored: ${LAST_MIRRORED:-<none>})"

          if [ "$LAST_MIRRORED" = "$UPSTREAM_TAG" ]; then
            echo "::notice::already mirrored ${UPSTREAM_TAG}; nothing to do."
            echo "due=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Version comes from the fork's own file, never from $UPSTREAM_TAG.
          FORK_VERSION="$(grep -m1 '__version__' src/kiro_crew/__init__.py | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')"
          FORK_BASE="$(printf '%s' "$FORK_VERSION" | sed -E 's/-roycrew\.[0-9]+$//')"

          # ponytail: FORK_BASE is interpolated into an ERE unescaped (dots
          # match any char) -- negligible false-positive risk for a semver
          # string, not worth an escaping helper for one grep.
          # `|| true`: grep exits 1 on no match, e.g. the first-ever release
          # of a new base version -- under `set -e` that would otherwise abort
          # this step before NEW_TAG is computed, exactly the case this
          # workflow exists to handle.
          MAX_N="$(gh api "repos/${{ github.repository }}/releases" --jq '.[].tag_name' \
            | { grep -E "^v${FORK_BASE}-roycrew\.[0-9]+\$" || true; } \
            | sed -E 's/.*-roycrew\.([0-9]+)$/\1/' \
            | sort -n | tail -1)"
          NEW_TAG="v${FORK_BASE}-roycrew.$(( ${MAX_N:-0} + 1 ))"

          # Belt-and-suspenders: should be unreachable given MAX_N+1 above,
          # but never re-cut an existing tag.
          if gh release view "$NEW_TAG" >/dev/null 2>&1; then
            echo "::notice::${NEW_TAG} already exists; nothing to do (idempotent)."
            echo "due=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DELIM="EOF_$(date +%s%N)"
          {
            echo "due=true"
            echo "tag=${NEW_TAG}"
            echo "upstream_tag=${UPSTREAM_TAG}"
            echo "upstream_url=${UPSTREAM_URL}"
            echo "body<<$DELIM"
            echo "$UPSTREAM_BODY"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      # Never release a red commit. The reusable build/publish lanes in this
      # repo probe artifacts and skip cleanly on failure; a GitHub Release is
      # different -- publishing it is irreversible-in-effect (it immediately
      # fires build-desktop-fork.yml), so the gate lives here instead.
      - name: Verify main's CI is green before releasing
        if: steps.check.outputs.due == 'true'
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          CONCLUSION="$(gh run list --repo "${{ github.repository }}" --workflow=ci.yml --branch main \
            --json headSha,conclusion --jq "[.[] | select(.headSha == \"$SHA\")][0].conclusion // empty")"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::refusing to release ${SHA}: CI's most recent run for this commit is '${CONCLUSION:-<none found>}', not 'success'."
            exit 1
          fi
          echo "CI is green for ${SHA}"

      - name: Create the release
        if: steps.check.outputs.due == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
          UPSTREAM_TAG: ${{ steps.check.outputs.upstream_tag }}
          UPSTREAM_URL: ${{ steps.check.outputs.upstream_url }}
          UPSTREAM_BODY: ${{ steps.check.outputs.body }}
        run: |
          set -euo pipefail
          NOTES="$(cat <<NOTES_EOF
          Mirrors kirodotdev/KiroCrew's [${UPSTREAM_TAG}](${UPSTREAM_URL}).

          Publishing this triggers \`build-desktop-fork.yml\`, which builds and attaches the macOS + Linux desktop artifacts.

          ---

          ${UPSTREAM_BODY}

          <!-- mirrors-upstream: ${UPSTREAM_TAG} -->
          NOTES_EOF
          )"
          gh release create "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --notes "$NOTES"
